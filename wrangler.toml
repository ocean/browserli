name = "browserli"
main = "src/index.ts"
compatibility_date = "2026-02-05"
compatibility_flags = ["nodejs_compat"]
# Unbound removes the 30 s waitUntil cap, allowing browser sessions to stay
# alive for the full BROWSER_KEEP_ALIVE_MS duration between requests.
usage_model = "unbound"

# Plan-tier configuration.
# Adjust these to match the Cloudflare Browser Rendering plan in use.
# Free plan defaults : BROWSER_MAX_SESSIONS = "2",  BROWSER_KEEP_ALIVE_MS = "60000"
# Paid plan maximums : BROWSER_MAX_SESSIONS = "10", BROWSER_KEEP_ALIVE_MS = "600000"
[vars]
BROWSER_MAX_SESSIONS = "8"
BROWSER_KEEP_ALIVE_MS = "300000"

[browser]
binding = "BROWSER"

# Session pool KV namespace.
# Create with: wrangler kv namespace create BROWSER_SESSIONS
#              wrangler kv namespace create BROWSER_SESSIONS --preview
# Then replace the IDs below with the output values.
[[kv_namespaces]]
binding = "BROWSER_SESSIONS"
id = "796d36c15db048bb8175e416b4bf0bdd"
preview_id = "dee9fcdcc6624e169f7e3421ae8539ed"

# Rate Limiting API configuration
# Prevents brute-force attacks on API endpoints
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 300
period = 60

[[routes]]
pattern = "browserli.drewr.dev"
custom_domain = true
